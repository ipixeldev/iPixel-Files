name: Build iPixel-Files IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Show selected SDK
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
      - name: Run regressions and build arm64 IPA
        env:
          WQFILES_FINAL_IPA: ${{ github.workspace }}/iPixel-Files.ipa
        run: ./build.sh
      - name: Upload IPA for sideloading
        uses: actions/upload-artifact@v4
        with:
          name: iPixel-Files-IPA
          path: iPixel-Files.ipa
          if-no-files-found: error
      - name: Prepare release notes
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NOTES="RELEASE_NOTES_${VERSION}.md"
          if [[ -f "$NOTES" ]]; then cp "$NOTES" release-body.md; else cp IPIXEL-README.md release-body.md; fi
      - name: Publish IPA to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: iPixel-Files.ipa
          body_path: release-body.md
          generate_release_notes: true
      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iPixel-Files-test-logs
          path: .work/tests/
          if-no-files-found: ignore
